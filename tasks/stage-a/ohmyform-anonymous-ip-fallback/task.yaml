protocolNotes: >-
  Bugfix/characterization slice: the probe drives the public entry with a
  table of inputs (regular/anonymous x IP present/absent) against fake
  dependencies. The current implementation already satisfies part of the
  table (missingIp '?' is encoded in the v2 probe); the slice hardens the
  contract as a characterization suite.
