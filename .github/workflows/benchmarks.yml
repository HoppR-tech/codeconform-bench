name: Code quality benchmarks

on:
  workflow_dispatch:
  push:
    branches: [feat/ccb-ohmyform-docs]

permissions:
  contents: read

concurrency:
  group: ohmyform-code-quality-benchmark-v2
  cancel-in-progress: false

jobs:
  quality:
    name: Harness · build and tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out benchmark harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install and test harness
        run: npm ci && npm test

      - name: Publish tested harness build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: harness-dist-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 1

  evaluator-preflight:
    name: Evaluator · exact-pin unpaid preflight
    needs: quality
    runs-on: ubuntu-24.04
    steps:
      - name: Check out benchmark harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install harness dependencies
        run: npm ci --ignore-scripts

      - name: Download tested harness build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: harness-dist-${{ github.sha }}
          path: dist

      - name: Check out exact evaluator pin
        run: |
          set -euo pipefail
          mkdir -p .bench
          git clone --filter=blob:none --branch benchmark/ohmyform-v2 https://github.com/HoppR-tech/ccb-evaluator.git .bench/evaluator
          git -C .bench/evaluator checkout --detach 2b0deb6df0e2b3e2fe9627ce361e92cd6d1e2a45
          test "$(git -C .bench/evaluator rev-parse HEAD)" = "2b0deb6df0e2b3e2fe9627ce361e92cd6d1e2a45"
          npm ci --ignore-scripts --prefix .bench/evaluator

      - name: Exercise passing and failing fixtures through ProcessEvaluator
        run: npm run preflight:evaluator -- "${{ github.workspace }}/campaigns/ohmyform-v2-gpt-5.6-luna.json" "${{ github.workspace }}/.bench/evaluator/test/fixtures"


  benchmark-ohmyform-small-models:
    name: Benchmark · OhMyForm · ${{ matrix.name }}
    needs: [quality, evaluator-preflight]
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run benchmark]')
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - name: GPT-5.6 Luna
            campaign: campaigns/ohmyform-v2-gpt-5.6-luna.json
            output: ohmyform-submission-start-v2-gpt-5.6-luna
          - name: Gemini 3.1 Flash Lite
            campaign: campaigns/ohmyform-v2-gemini-3.1-flash-lite.json
            output: ohmyform-submission-start-v2-gemini-3.1-flash-lite
          - name: Mistral Small 2603
            campaign: campaigns/ohmyform-v2-mistral-small-2603.json
            output: ohmyform-submission-start-v2-mistral-small-2603
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out benchmark harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install harness dependencies
        run: npm ci --ignore-scripts

      - name: Download tested harness build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: harness-dist-${{ github.sha }}
          path: dist

      - name: Prepare pinned campaign inputs
        run: |
          set -euo pipefail
          mkdir -p .bench/targets .bench/dependencies
          git clone --filter=blob:none https://github.com/HoppR-tech/ccb-ohmyform.git .bench/targets/ccb-ohmyform
          git -C .bench/targets/ccb-ohmyform checkout --detach 0f602c646447cb8efc0ad346a2bf4869c30d2360
          git clone --filter=blob:none --branch benchmark/ohmyform-v2 https://github.com/HoppR-tech/ccb-evaluator.git .bench/evaluator
          git -C .bench/evaluator checkout --detach 2b0deb6df0e2b3e2fe9627ce361e92cd6d1e2a45
          npm ci --ignore-scripts --prefix .bench/evaluator
          mkdir -p .bench/dependencies/ohmyform-v1-api
          cp .bench/targets/ccb-ohmyform/api/package.json .bench/targets/ccb-ohmyform/api/yarn.lock .bench/dependencies/ohmyform-v1-api/
          docker run --rm \
            --platform linux/amd64 \
            --mount "type=bind,source=${{ github.workspace }}/.bench/dependencies/ohmyform-v1-api,target=/work" \
            --workdir /work \
            node@sha256:cd59a61258b82b86c1ff0ead50c8a689f6c3483c5ed21036e11ee741add419eb \
            yarn install --frozen-lockfile

      - name: Require benchmark credentials
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GRACE_MCP_TOKEN: ${{ secrets.GRACE_MCP_TOKEN }}
        run: test -n "$OPENROUTER_API_KEY" && test -n "$GRACE_MCP_TOKEN"

      - name: Run three paired baseline and Grace conditions
        env:
          CAMPAIGN: ${{ matrix.campaign }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GRACE_MCP_TOKEN: ${{ secrets.GRACE_MCP_TOKEN }}
        run: node dist/src/cli.js "$CAMPAIGN"

      - name: Publish token, cost, and result summary
        if: always()
        env:
          OUTPUT: ${{ matrix.output }}
        run: |
          summary=".bench/results/$OUTPUT/summary.md"
          if [[ -f "$summary" ]]; then
            cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          else
            printf '## Benchmark summary unavailable\n\nThe campaign stopped before producing results.\n' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload scoring evidence and provenance records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.output }}-${{ github.run_id }}
          path: |
            .bench/results/${{ matrix.output }}/campaign-manifest.json
            .bench/results/${{ matrix.output }}/aggregate.json
            .bench/results/${{ matrix.output }}/summary.md
            .bench/results/${{ matrix.output }}/report.md
            .bench/results/${{ matrix.output }}/runs/pair-*.json
            .bench/results/${{ matrix.output }}/evaluator/*.failure.json
            .bench/results/${{ matrix.output }}/evaluator/*.result-sanitized.json
            .bench/results/${{ matrix.output }}/failures/*-candidate-recovery.json
            !.bench/results/${{ matrix.output }}/runs/*-trace.json
          if-no-files-found: warn
          retention-days: 30
